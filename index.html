<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>편제 변경 플로우</title>
  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css");

    :root {
      --ink: #000000;
      --ink-soft: #31302e;
      --paper: #f6f5f4;
      --panel: #ffffff;
      --canvas: #ffffff;
      --line: #615d59;
      --muted: #615d59;
      --faint: #a39e98;
      --hairline: #e6e6e6;
      --accent: #0075de;
      --accent-active: #005bab;
      --node-bg: #ffffff;
      --node-border: #a39e98;
      --node-text: #000000;
      --node-subtle: #615d59;
      --dept-bg: #f6f5f4;
      --dept-border: #e6e6e6;
      --dept-label-bg: #000000;
      --created: #1aae39;
      --revised: #005bab;
      --renewed: #7b61d1;
      --closed: #d64545;
      --merged: #dd5b00;
      --splitted: #2a9d99;
      --page-max-width: 1680px;
      --page-gutter: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      color: var(--ink);
      font-family: "Pretendard Variable", "Pretendard", "Segoe UI", "Malgun Gothic", sans-serif;
      font-weight: 400;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--paper);
      border-bottom: 1px solid var(--hairline);
      backdrop-filter: blur(10px);
    }

    .app-titlebar {
      display: grid;
      grid-template-columns: minmax(max-content, 1fr) auto minmax(max-content, 1fr);
      align-items: center;
      gap: 12px;
      width: min(calc(100% - 2 * var(--page-gutter)), var(--page-max-width));
      margin: 0 auto;
      padding: 14px 18px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .brand-kicker {
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
    }

    .filter-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      justify-self: center;
    }

    h1 {
      margin: 0;
      font-size: 19px;
      letter-spacing: 0;
    }

    label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      white-space: nowrap;
    }

    input,
    select,
    button {
      min-height: 34px;
      border: 1px solid var(--hairline);
      border-radius: 0;
      background: var(--panel);
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      padding: 6px 8px;
    }

    button {
      border-color: var(--ink);
      background: var(--ink);
      color: var(--panel);
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      border-color: var(--faint);
      background: var(--faint);
      cursor: not-allowed;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-left: auto;
      justify-self: end;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    .legend i {
      display: inline-block;
      width: 16px;
      height: 3px;
      margin-right: 5px;
      vertical-align: middle;
      background: var(--ink);
    }

    @media (max-width: 1120px) {
      .app-titlebar {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .filter-controls,
      .legend {
        justify-self: start;
      }
    }

    .canvas-wrap {
      flex: 1;
      min-height: 0;
      padding: 0;
      overflow: auto;
      background: var(--canvas);
    }

    .main-shell {
      width: min(calc(100% - 2 * var(--page-gutter)), var(--page-max-width));
      margin: 0 auto;
    }

    .flow-content {
      width: max-content;
      min-width: min(800px, 100%);
      margin: 0 auto;
    }

    .year-header {
      position: sticky;
      top: 0;
      left: 0;
      z-index: 20;
      height: 44px;
      width: 100%;
      min-width: 100%;
      margin-bottom: 0;
      background: rgba(255, 255, 255, 0.88);
      border-bottom: 1px solid var(--hairline);
      box-shadow: none;
      backdrop-filter: blur(10px);
    }

    .year-shell {
      position: relative;
      width: min(calc(100% - 2 * var(--page-gutter)), var(--page-max-width));
      height: 100%;
      margin: 0 auto;
      overflow: visible;
    }

    .year-track {
      position: relative;
      height: 100%;
      width: max-content;
      min-width: min(800px, 100%);
    }

    .canvas {
      position: relative;
      width: max-content;
      min-width: min(800px, 100%);
      height: 920px;
      margin: 0 auto;
      background: var(--canvas);
      border: 0;
      box-shadow: none;
    }

    svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      overflow: visible;
      pointer-events: none;
    }

    .node {
      position: absolute;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--node-width, 178px);
      min-width: 132px;
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--node-border);
      border-radius: 0;
      background: var(--node-bg);
      color: var(--node-text);
      text-align: center;
      box-shadow: none;
      cursor: default;
    }

    .node.college {
      width: var(--node-width, 178px);
      height: 42px;
      border-color: var(--node-border);
      background: var(--node-bg);
      color: var(--node-text);
    }

    .node.major {
      width: var(--node-width, 178px);
      height: 42px;
      border-color: var(--node-border);
      border-radius: 0;
      background: var(--node-bg);
    }

    .node.focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .node.related {
      outline: 1px solid var(--faint);
      outline-offset: 2px;
    }

    .node.dimmed {
      opacity: 0.22;
    }

    .node-title {
      display: block;
      max-width: 100%;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.2;
      word-break: keep-all;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dept-box {
      position: absolute;
      z-index: 1;
      width: var(--dept-box-width, 214px);
      border: 0;
      border-radius: 0;
      background: var(--dept-bg);
      box-shadow: none;
    }

    .dept-box.focus {
      background: var(--panel);
      box-shadow: none;
    }

    .dept-box.related {
      background: rgba(246, 245, 244, 0.62);
    }

    .dept-box.dimmed {
      opacity: 0.16;
    }

    .dept-box-title {
      position: absolute;
      left: 12px;
      top: -12px;
      max-width: var(--dept-box-title-width, 188px);
      padding: 3px 8px;
      border: 0;
      border-radius: 0;
      background: var(--dept-label-bg);
      color: var(--panel);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .group-label {
      position: absolute;
      z-index: 2;
      left: 44px;
      width: 145px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      text-align: right;
      border-top: 1px solid var(--hairline);
      padding-top: 8px;
    }

    .year-label {
      position: absolute;
      z-index: 2;
      top: 14px;
      width: 130px;
      margin-left: -65px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      text-align: center;
    }

    .flow-line {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.9;
      marker-end: url(#arrow);
    }

    .flow-line.created { stroke: var(--created); }
    .flow-line.revised { stroke: var(--revised); stroke-width: 2.2; }
    .flow-line.renewed { stroke: var(--renewed); }
    .flow-line.closed { stroke: var(--closed); }
    .flow-line.merged { stroke: var(--merged); }
    .flow-line.splitted { stroke: var(--splitted); }
    .flow-line.unchanged {
      stroke: var(--faint);
      stroke-width: 1.4;
      opacity: 0.52;
    }
    .flow-line.dimmed { opacity: 0.12; }
    .flow-line.focus { stroke-width: 2.8; opacity: 1; }

    .edge-label {
      fill: var(--ink);
      font-size: 11px;
      font-weight: 600;
      paint-order: stroke;
      stroke: var(--canvas);
      stroke-width: 6px;
      stroke-linejoin: round;
    }

    .edge-label.created { fill: var(--created); }
    .edge-label.revised { fill: var(--revised); }
    .edge-label.renewed { fill: var(--renewed); }
    .edge-label.closed { fill: var(--closed); }
    .edge-label.merged { fill: var(--merged); }
    .edge-label.splitted { fill: var(--splitted); }
    .edge-label.unchanged { display: none; }
    .edge-label.dimmed { opacity: 0.12; }

    .empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      font-size: 15px;
      z-index: 4;
    }

    .tooltip {
      position: fixed;
      z-index: 50;
      display: none;
      max-width: 360px;
      padding: 10px 12px;
      border: 1px solid var(--hairline);
      border-radius: 0;
      background: var(--panel);
      box-shadow: none;
      color: var(--ink);
      font-size: 13px;
      line-height: 1.45;
      pointer-events: none;
    }

    .detail-panel {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 40;
      display: none;
      width: 420px;
      max-width: calc(100vw - 32px);
      max-height: min(420px, calc(100vh - 160px));
      overflow: auto;
      border: 1px solid var(--hairline);
      border-radius: 0;
      background: rgba(255, 255, 255, 0.94);
      color: var(--ink);
      box-shadow: none;
      backdrop-filter: blur(12px);
    }

    .detail-panel.is-open {
      display: block;
    }

    .detail-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--hairline);
      cursor: grab;
      user-select: none;
      touch-action: none;
    }

    .detail-panel.is-dragging .detail-head {
      cursor: grabbing;
    }

    .detail-title {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.35;
    }

    .detail-subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .detail-close {
      min-width: 44px;
      min-height: 30px;
      padding: 0 8px;
      background: var(--panel);
      color: var(--ink);
      border-color: var(--hairline);
      white-space: nowrap;
      cursor: pointer;
    }

    .detail-body {
      display: grid;
      gap: 14px;
      padding: 14px 16px 16px;
    }

    .detail-section {
      display: grid;
      gap: 8px;
    }

    .detail-section.relation-section {
      margin-top: 6px;
      gap: 10px;
    }

    .detail-section-title {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .detail-list {
      display: grid;
      gap: 6px;
      margin: 0;
    }

    .detail-row {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 8px;
      font-size: 12px;
      line-height: 1.45;
    }

    .detail-row dt {
      color: var(--muted);
    }

    .detail-row dd {
      margin: 0;
      color: var(--ink);
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .relation-list {
      display: grid;
      gap: 0;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .relation-card {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr);
      column-gap: 18px;
      row-gap: 4px;
      align-items: center;
      padding: 10px 0 8px;
      border-top: 0;
      font-size: 12px;
      line-height: 1.45;
    }

    .relation-card.is-new-direction {
      margin-top: 0;
      padding-top: 8px;
      border-top: 1px solid var(--hairline);
    }

    .relation-card:first-child {
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
    }

    .relation-main {
      display: contents;
      min-width: 0;
    }

    .relation-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 58px;
      height: 20px;
      padding: 0 8px;
      background: var(--ink);
      color: var(--panel);
      border-radius: 99px;
      font-size: 10px;
      font-weight: 600;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
    }

    .relation-copy {
      min-width: 0;
      color: var(--ink);
      overflow-wrap: anywhere;
    }

    .relation-kind {
      font-weight: 600;
    }

    .relation-note {
      grid-column: 2;
      color: var(--muted);
    }

    .editor-modal {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(246, 245, 244, 0.82);
      backdrop-filter: blur(8px);
    }

    .editor-modal.is-open {
      display: flex;
    }

    .editor-panel {
      width: min(760px, calc(100vw - 32px));
      max-height: calc(100vh - 40px);
      overflow: auto;
      border: 1px solid var(--hairline);
      background: var(--panel);
    }

    .editor-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--hairline);
    }

    .editor-title {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
    }

    .editor-subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .editor-body {
      display: grid;
      gap: 18px;
      padding: 18px;
    }

    .editor-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .editor-grid label,
    .editor-stack label {
      display: grid;
      gap: 6px;
      align-items: start;
      color: var(--muted);
      font-size: 12px;
      white-space: normal;
    }

    .editor-grid input,
    .editor-grid select,
    .editor-stack textarea,
    .endpoint-input {
      width: 100%;
    }

    .editor-stack {
      display: grid;
      gap: 8px;
    }

    .editor-section {
      display: grid;
      gap: 10px;
      padding: 14px;
      border: 1px solid var(--hairline);
      background: #fcfbfa;
    }

    .editor-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .editor-section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .editor-helper,
    .editor-status {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .editor-status[data-tone="error"] {
      color: var(--closed);
    }

    .editor-status[data-tone="success"] {
      color: var(--created);
    }

    .endpoint-list {
      display: grid;
      gap: 8px;
    }

    .endpoint-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .endpoint-remove,
    .editor-secondary {
      min-width: 44px;
      padding: 0 10px;
      border-color: var(--hairline);
      background: var(--panel);
      color: var(--ink);
    }

    .editor-actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .editor-actions-right {
      display: flex;
      gap: 10px;
    }

    @media (max-width: 720px) {
      .editor-grid {
        grid-template-columns: 1fr;
      }

      .editor-actions {
        flex-direction: column-reverse;
      }

      .editor-actions-right {
        justify-content: flex-end;
      }
    }

  </style>
</head>
<body>
  <header class="app-header">
    <div class="app-titlebar">
      <div class="brand">
        <h1>편제 변경 이력</h1>
      </div>
      <div class="filter-controls">
        <label>시작 학년도
          <select id="startYear"></select>
        </label>
        <label>종료 학년도
          <select id="endYear"></select>
        </label>
        <label>검색
          <input id="searchBox" type="search" placeholder="학과명/전공명/코드">
        </label>
        <button id="openEditorBtn" type="button">개편 입력</button>
        <button id="resetBtn" type="button">초기화</button>
      </div>
      <div class="legend">
        <span><i style="background:var(--renewed)"></i>개편</span>
        <span><i style="background:var(--revised)"></i>명칭변경</span>
        <span><i style="background:var(--splitted)"></i>분리</span>
        <span><i style="background:var(--merged)"></i>통합</span>
        <span><i style="background:var(--created)"></i>신설</span>
        <span><i style="background:var(--closed)"></i>폐지</span>
      </div>
    </div>
  </header>

  <div class="canvas-wrap" id="canvasWrap">
    <div class="year-header" id="yearHeader">
      <div class="year-shell">
        <div class="year-track" id="yearTrack"></div>
      </div>
    </div>
    <div class="main-shell">
      <div class="flow-content" id="flowContent">
        <section class="canvas" id="canvas">
          <svg id="svg">
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"></path>
              </marker>
            </defs>
          </svg>
          <aside class="detail-panel" id="detailPanel" aria-live="polite" aria-label="선택 학과 전공 상세"></aside>
          <div class="empty" id="empty">dim_org_unit.csv와 org_unit_relation.csv를 자동으로 불러오는 중입니다.</div>
        </section>
      </div>
    </div>
  </div>

  <div class="tooltip" id="tooltip"></div>
  <div class="editor-modal" id="editorModal" aria-hidden="true">
    <div class="editor-panel" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
      <div class="editor-head">
        <div>
          <h2 class="editor-title" id="editorTitle">편제개편 입력</h2>
          <div class="editor-subtitle">편제단위를 선택하면 경로 코드는 자동으로 채워집니다.</div>
        </div>
        <button class="editor-secondary" id="editorCloseBtn" type="button">닫기</button>
      </div>
      <form class="editor-body" id="editorForm">
        <div class="editor-grid">
          <label>변경 학년도
            <input id="editorYear" name="changeYear" type="number" min="1900" step="1" required>
          </label>
          <label>변경 유형
            <select id="editorType" name="changeType" required></select>
          </label>
        </div>
        <div class="editor-grid">
          <label>존속기한
            <input id="editorRetainUntil" name="retainUntilGradYear" type="number" min="1900" step="1" placeholder="예: 2028">
          </label>
          <label>비고
            <input id="editorNote" name="note" type="text" placeholder="선택 입력">
          </label>
        </div>
        <section class="editor-section">
          <div class="editor-section-head">
            <div class="editor-section-title">이전 편제</div>
            <button class="editor-secondary" id="addPrevEndpointBtn" type="button">추가</button>
          </div>
          <div class="editor-helper" id="prevEndpointHelper"></div>
          <div class="endpoint-list" id="prevEndpointList"></div>
        </section>
        <section class="editor-section">
          <div class="editor-section-head">
            <div class="editor-section-title">이후 편제</div>
            <button class="editor-secondary" id="addAfterEndpointBtn" type="button">추가</button>
          </div>
          <div class="editor-helper" id="afterEndpointHelper"></div>
          <div class="endpoint-list" id="afterEndpointList"></div>
        </section>
        <div class="editor-status" id="editorStatus"></div>
        <div class="editor-actions">
          <div class="editor-helper">현재는 관계 1건씩 저장합니다. 저장 후 화면 데이터가 즉시 다시 로드됩니다.</div>
          <div class="editor-actions-right">
            <button class="editor-secondary" id="editorCancelBtn" type="button">취소</button>
            <button id="editorSubmitBtn" type="submit">저장</button>
          </div>
        </div>
      </form>
    </div>
  </div>
  <datalist id="unitOptionList"></datalist>

  <script>
    const state = {
      units: new Map(),
      relations: [],
      nodes: [],
      edges: [],
      selectedNodeKey: "",
      defaultStartYear: "",
      defaultEndYear: "",
      detailPanelMoved: false,
      detailDrag: null,
      editorEndpointSeed: 0
    };
    const DEFAULT_FILES = {
      dim: "dim_org_unit.csv",
      relation: "org_unit_relation.csv"
    };
    const CHANGE_TYPE_LABELS = {

    function syncYearHeader() {
      yearTrack.style.transform = `translateX(${-canvasWrap.scrollLeft}px)`;
      if (detailPanel.classList.contains("is-open") && !state.detailPanelMoved) {
        positionDetailPanel();
      }

    function centerFlowContent() {
      requestAnimationFrame(() => {
        const maxScrollLeft = canvasWrap.scrollWidth - canvasWrap.clientWidth;
        canvasWrap.scrollLeft = maxScrollLeft > 0 ? Math.floor(maxScrollLeft / 2) : 0;
        syncYearHeader();
      });
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function applyResponsiveLayout(yearCount) {
      const viewportWidth = document.documentElement.clientWidth;
      const compactness = yearCount > 6 ? 0.075 : 0.085;
      const nodeWidth = Math.round(clamp(viewportWidth * compactness, 132, 178));
      const canvasPadding = viewportWidth < 1100 ? 24 : viewportWidth < 1440 ? 36 : 48;
      const minColumnStep = Math.max(nodeWidth + 18, viewportWidth < 1100 ? 128 : viewportWidth < 1440 ? 148 : 170);

      LAYOUT.wrapPadding = viewportWidth < 1100 ? 16 : 32;
      LAYOUT.canvasPadding = canvasPadding;
      LAYOUT.minColumnStep = minColumnStep;
      LAYOUT.nodeWidth = nodeWidth;
      LAYOUT.nodeHalfWidth = nodeWidth / 2;
      LAYOUT.edgeAnchorOffset = nodeWidth / 2 + 1;
      LAYOUT.deptBoxHalfWidth = nodeWidth / 2 + 18;

      document.documentElement.style.setProperty("--node-width", `${nodeWidth}px`);
      document.documentElement.style.setProperty("--dept-box-width", `${nodeWidth + 36}px`);
      document.documentElement.style.setProperty("--dept-box-title-width", `${nodeWidth + 10}px`);
      document.documentElement.style.setProperty("--page-gutter", `${viewportWidth < 1100 ? 12 : 18}px`);
    }

    async function bootstrapData() {
      try {
        await loadData();
      } catch (_error) {
        empty.textContent = "dim_org_unit.csv와 org_unit_relation.csv를 같은 폴더에 두고 http://localhost 같은 로컬 서버로 열어주세요.";
      }
    }

    async function loadData() {
      const { unitText, relationText } = await loadCsvSources();
      ingestData(unitText, relationText);
      populateUnitOptionList();
      initializeEditorForm();
      empty.textContent = "조건에 맞는 변경 이력이 없습니다.";
    }

    async function loadCsvSources() {
      const [unitText, relationText] = await Promise.all([
        fetchCsvText(DEFAULT_FILES.dim),
        fetchCsvText(DEFAULT_FILES.relation)
      ]);
      return {
        unitText,
        relationText
      };
    }

    async function fetchCsvText(path) {
      const response = await fetch(path, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`Failed to fetch ${path}: ${response.status}`);
      }
      return response.text();
    }

    function ingestData(unitText, relationText) {

      state.units.clear();
      parseCsv(unitText).forEach(row => {
        const code = clean(row.unit_code);
        if (!code) return;
        state.units.set(code, {
          code,
          name: clean(row.unit_name),
          type: clean(row.unit_type),
          parent: clean(row.parent_code),
          temp: clean(row.is_temp_code)
        });
      });

      state.relations = parseCsv(relationText)
        .map(row => ({
          id: clean(row.relation_id),
          year: Number(clean(row.change_year)),
          type: clean(row.change_type),
          validUntil: clean(row.valid_until),
          note: clean(row.note),
          source: firstCode(row.prev_major_code, row.prev_dept_code, row.prev_college_code),
          target: firstCode(row.after_major_code, row.after_dept_code, row.after_college_code),
          prevPath: [row.prev_college_code, row.prev_dept_code, row.prev_major_code].map(clean).filter(Boolean),
          afterPath: [row.after_college_code, row.after_dept_code, row.after_major_code].map(clean).filter(Boolean)
        }))
        .filter(row => row.year && (row.source || row.target));

      state.componentByCode = null;

      const years = unique(state.relations.map(row => row.year)).sort((a, b) => a - b);
      fillSelect(startYear, years);
      fillSelect(endYear, years);
      state.defaultStartYear = years.includes(2022) ? "2022" : String(years[0] || "");
      state.defaultEndYear = String(years[years.length - 1] || "");
      startYear.value = state.defaultStartYear;
      endYear.value = state.defaultEndYear;
      render();
    }

    function populateUnitOptionList() {
      const units = [...state.units.values()].sort((a, b) => {
        const typeOrder = { college: 0, department: 1, major: 2 };
        const typeDiff = (typeOrder[a.type] ?? 9) - (typeOrder[b.type] ?? 9);
        if (typeDiff) return typeDiff;
        return `${a.name} ${a.code}`.localeCompare(`${b.name} ${b.code}`, "ko");
      });

      unitOptionList.innerHTML = units
        .map(unit => {
          const path = pathLabel(pathFromUnit(unit.code));
          return `<option value="${escapeHtml(unit.name)} (${escapeHtml(unit.code)})" label="${escapeHtml(path)}"></option>`;
        })
        .join("");
    }

    function initializeEditorForm() {
      const years = unique(state.relations.map(row => row.year)).sort((a, b) => a - b);
      const latestYear = years[years.length - 1] || new Date().getFullYear();

      fillSelect(
        editorType,
        Object.keys(CHANGE_TYPE_LABELS).filter(key => key !== "unchanged"),
        false,
        CHANGE_TYPE_LABELS
      );

      editorYear.value = String(latestYear);
      editorType.value = "renewed";
      editorRetainUntil.value = "";
      editorNote.value = "";
      prevEndpointList.innerHTML = "";
      afterEndpointList.innerHTML = "";
      addEndpointRow("prev");
      addEndpointRow("after");
      setEditorStatus("", "");
      syncEditorTypeHints();
    }

    function openEditorModal() {
      initializeEditorForm();
      editorModal.classList.add("is-open");

      editorYear.focus();
    }

    function closeEditorModal() {
      editorModal.classList.remove("is-open");

    function addEndpointRow(side, initialValue = "") {
      const list = side === "prev" ? prevEndpointList : afterEndpointList;
      const row = document.createElement("div");
      row.className = "endpoint-row";
      row.dataset.side = side;
      row.dataset.rowId = `${side}-${++state.editorEndpointSeed}`;
      row.innerHTML = `
        <input class="endpoint-input" type="text" list="unitOptionList" placeholder="학과명 또는 코드 선택" value="${escapeHtml(initialValue)}">
        <button class="endpoint-remove" type="button" aria-label="${side === "prev" ? "이전" : "이후"} 편제 삭제">삭제</button>
      `;

      row.querySelector(".endpoint-remove").addEventListener("click", () => {
        row.remove();
        syncEditorTypeHints();
      });

      list.appendChild(row);
      syncEditorTypeHints();
    }

    function ensureEndpointRows(side, minimum) {
      const list = side === "prev" ? prevEndpointList : afterEndpointList;
      while (list.children.length < minimum) {
        addEndpointRow(side);
      }
    }

    function syncEditorTypeHints() {
      const type = editorType.value;
      const rules = {
        created: { prev: 0, after: 1, prevText: "이전 편제는 비워둘 수 있습니다.", afterText: "이후 편제는 1개 이상 필요합니다." },
        closed: { prev: 1, after: 0, prevText: "이전 편제는 1개 이상 필요합니다.", afterText: "이후 편제는 비워둘 수 있습니다." },
        revised: { prev: 1, after: 1, prevText: "이전 편제는 1개 이상 필요합니다.", afterText: "이후 편제는 1개 이상 필요합니다." },
        renewed: { prev: 1, after: 1, prevText: "이전 편제는 1개 이상 필요합니다.", afterText: "이후 편제는 1개 이상 필요합니다." },
        merged: { prev: 1, after: 1, prevText: "이전 편제는 보통 여러 개를 넣습니다.", afterText: "이후 편제는 1개 이상 필요합니다." },
        splitted: { prev: 1, after: 1, prevText: "이전 편제는 1개 이상 필요합니다.", afterText: "이후 편제는 보통 여러 개를 넣습니다." }
      }[type] || { prev: 1, after: 1, prevText: "", afterText: "" };

      ensureEndpointRows("prev", rules.prev);
      ensureEndpointRows("after", rules.after);
      prevEndpointHelper.textContent = rules.prevText;
      afterEndpointHelper.textContent = rules.afterText;
    }

    function setEditorStatus(message, tone = "") {
      editorStatus.textContent = message;
      if (tone) {
        editorStatus.dataset.tone = tone;
      } else {
        delete editorStatus.dataset.tone;
      }
    }

    function setEditorSubmitting(isSubmitting) {
      editorSubmitBtn.disabled = isSubmitting;
      editorCloseBtn.disabled = isSubmitting;
      editorCancelBtn.disabled = isSubmitting;
      addPrevEndpointBtn.disabled = isSubmitting;
      addAfterEndpointBtn.disabled = isSubmitting;
      editorForm.querySelectorAll("input, select, button").forEach(element => {
        if (element === editorSubmitBtn || element === editorCloseBtn || element === editorCancelBtn || element === addPrevEndpointBtn || element === addAfterEndpointBtn) {
          return;
        }
        element.disabled = isSubmitting;
      });

    function resolveUnitCode(inputValue) {
      const text = clean(inputValue);
      if (!text) return "";
      if (state.units.has(text)) return text;

      const codeMatch = text.match(/\(([^()]+)\)\s*$/);
      if (codeMatch && state.units.has(codeMatch[1])) {
        return codeMatch[1];
      }

      const exactNameMatches = [...state.units.values()].filter(unit => unit.name === text);
      if (exactNameMatches.length === 1) {
        return exactNameMatches[0].code;
      }

      return "";
    }

    function collectEndpointCodes(side) {
      const list = side === "prev" ? prevEndpointList : afterEndpointList;
      const values = [...list.querySelectorAll(".endpoint-input")]
        .map(input => ({ raw: clean(input.value), code: resolveUnitCode(input.value) }))
        .filter(item => item.raw || item.code);

      const invalid = values.filter(item => item.raw && !item.code).map(item => item.raw);
      if (invalid.length) {
        throw new Error(`${side === "prev" ? "이전" : "이후"} 편제에서 선택되지 않은 항목이 있습니다: ${invalid.join(", ")}`);
      }

      return unique(values.map(item => item.code));
    }

    async function submitEditorForm(event) {
      event.preventDefault();

      try {
        setEditorSubmitting(true);
        setEditorStatus("저장 중입니다...", "");

        const payload = {
          changeYear: Number(editorYear.value),
          changeType: editorType.value,
          retainUntilGradYear: clean(editorRetainUntil.value),
          note: clean(editorNote.value),
          prevUnitCodes: collectEndpointCodes("prev"),
          afterUnitCodes: collectEndpointCodes("after")
        };

        const response = await fetch("/api/relations", {
          method: "POST",
          headers: { "Content-Type": "application/json; charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (!response.ok || !result.ok) {
          throw new Error(result.error || "저장에 실패했습니다.");
        }

        setEditorStatus("저장되었습니다. 화면을 다시 불러오는 중입니다.", "success");
        await loadData();
        closeEditorModal();
      } catch (error) {
        setEditorStatus(error.message || "저장에 실패했습니다.", "error");
      } finally {
        setEditorSubmitting(false);
      }
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let value = "";
      let inQuotes = false;
      const src = text.replace(/^\uFEFF/, "");

      for (let i = 0; i < src.length; i++) {
        const ch = src[i];
        const next = src[i + 1];
        if (ch === '"' && inQuotes && next === '"') {
          value += '"';
          i++;
        } else if (ch === '"') {
          inQuotes = !inQuotes;
        } else if (ch === "," && !inQuotes) {
          row.push(value);
          value = "";
        } else if ((ch === "\n" || ch === "\r") && !inQuotes) {
          if (ch === "\r" && next === "\n") i++;
          row.push(value);
          if (row.some(cell => cell.length)) rows.push(row);
          row = [];
          value = "";
        } else {
          value += ch;
        }
      }

      row.push(value);
      if (row.some(cell => cell.length)) rows.push(row);
      if (!rows.length) return [];

      const headers = rows.shift().map(clean);
      return rows.map(values => {
        const item = {};
        headers.forEach((header, index) => item[header] = values[index] ?? "");
        return item;
      });
    }

    function clean(value) {
      const v = String(value ?? "").trim();
      return v === "nan" || v === "NaN" || v === "<NA>" ? "" : v;
    }

    function firstCode(...values) {
      return values.map(clean).find(Boolean) || "";
    }

    function unique(values) {
      return [...new Set(values.filter(v => v !== "" && v !== null && v !== undefined))];
    }

    function fillSelect(select, values, includeAll = false, labelMap = null) {
      select.innerHTML = includeAll ? '<option value="">전체</option>' : "";
      values.forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = labelMap?.[value] ?? value;
        select.appendChild(option);
      });
    }

    function resetFilters() {
      startYear.value = state.defaultStartYear;
      endYear.value = state.defaultEndYear;
      searchBox.value = "";
      state.selectedNodeKey = "";
      hideDetailPanel();
      render();
    }

    function render() {
      if (!state.relations.length) return;

      const from = Number(startYear.value);
      const to = Number(endYear.value);
      const minYear = Math.min(from, to);
      const maxYear = Math.max(from, to);

      const relations = state.relations
        .filter(row => row.year >= minYear && row.year <= maxYear)
        .filter(row => row.source && row.target);

      const allSnapshots = buildSnapshots();
      const years = [];
      for (let year = minYear - 1; year <= maxYear; year++) years.push(year);
      applyResponsiveLayout(years.length);
      const context = buildLayoutContext(relations, years, allSnapshots);
      const lanes = context.lanes;

      const canvasWidth = Math.max(
        LAYOUT.minCanvasWidth,
        Math.min(LAYOUT.pageMaxWidth, document.documentElement.clientWidth - 2 * LAYOUT.wrapPadding)
      );
      const firstColX = LAYOUT.canvasPadding + LAYOUT.nodeHalfWidth;
      const colStep = years.length > 1
        ? Math.max(
          LAYOUT.minColumnStep,
          Math.floor((canvasWidth - 2 * LAYOUT.canvasPadding - 2 * LAYOUT.nodeHalfWidth) / (years.length - 1))
        )
        : LAYOUT.minColumnStep;
      const graphWidth = years.length > 1
        ? Math.max(canvasWidth, firstColX + (years.length - 1) * colStep + LAYOUT.nodeHalfWidth + LAYOUT.canvasPadding)
        : canvasWidth;
      const width = graphWidth;

      const maxY = Math.max(...[...context.yByNode.values()], LAYOUT.minContentHeight);
      const height = Math.max(LAYOUT.minCanvasHeight, maxY + LAYOUT.canvasBottomPadding);

      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      flowContent.style.width = `${width}px`;
      yearTrack.style.width = `${width}px`;
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.setAttribute("width", width);
      svg.setAttribute("height", height);

      canvas.querySelectorAll(".node,.group-label,.dept-box").forEach(el => el.remove());
      yearTrack.querySelectorAll(".year-label").forEach(el => el.remove());
      clearSvg();

      const xByYear = new Map();
      years.forEach((year, index) => {
        const x = firstColX + index * colStep;
        xByYear.set(year, x);
        const label = document.createElement("div");
        label.className = "year-label";
        label.style.left = `${x}px`;
        label.textContent = `${year}학년도`;
        yearTrack.appendChild(label);
      });

      const nodeMap = new Map();
      years.forEach(year => {
        const items = lanes.get(year) || [];
        items.forEach((code, laneIndex) => {
          const unit = state.units.get(code) || { code, name: code, type: "department", parent: "" };
          const node = {
            code,
            year,
            unit,
            path: context.pathByNode.get(nodeKey(year, code)) || pathFromUnit(code),
            group: context.groupByNode.get(nodeKey(year, code)) || topCollegeCode(code),
            x: xByYear.get(year),
            y: context.yByNode.get(nodeKey(year, code)) || LAYOUT.layoutTop + laneIndex * LAYOUT.nodeFallbackStep
          };
          nodeMap.set(nodeKey(year, code), node);
        });
      });

      drawDeptBoxes([...nodeMap.values()]);
      [...nodeMap.values()].forEach(drawNode);

      state.edges = relations.map(row => {
        const sourceYear = row.year - 1;
        const targetYear = row.year;
        return {
          ...row,
          sourceYear,
          targetYear,
          sourceNode: nodeMap.get(nodeKey(sourceYear, row.source)),
          targetNode: nodeMap.get(nodeKey(targetYear, row.target))
        };
      }).filter(edge => edge.sourceNode && edge.targetNode);

      state.edges.push(...buildCarryEdges(years, nodeMap, relations));
      drawEdges();
      empty.style.display = state.edges.length ? "none" : "grid";
      state.nodes = [...nodeMap.values()];
      applySearch();
      centerFlowContent();
    }

    function buildSnapshots() {
      const changeYears = unique(state.relations.map(row => row.year)).sort((a, b) => a - b);
      if (!changeYears.length) return new Map();

      const firstChangeYear = changeYears[0];
      const snapshots = new Map();
      const base = new Map();

      state.relations
        .filter(row => row.year === firstChangeYear)
        .forEach(row => {
          if (row.source) base.set(row.source, row.prevPath.length ? row.prevPath : pathFromUnit(row.source));
        });

      snapshots.set(firstChangeYear - 1, base);

      let previous = new Map(base);
      changeYears.forEach(year => {
        const next = new Map(previous);
        state.relations
          .filter(row => row.year === year)
          .forEach(row => {
            if (row.source) next.delete(row.source);
            if (row.target) next.set(row.target, row.afterPath.length ? row.afterPath : pathFromUnit(row.target));
          });
        snapshots.set(year, next);
        previous = next;
      });

      return snapshots;
    }

    function buildLayoutContext(relations, years, snapshots) {
      const pathByNode = new Map();
      const groupByNode = new Map();

      years.forEach(year => {
        const snapshot = snapshots.get(year) || new Map();
        snapshot.forEach((path, code) => {
          const key = nodeKey(year, code);
          const resolvedPath = path.length ? path : pathFromUnit(code);
          pathByNode.set(key, resolvedPath);
          groupByNode.set(key, currentGroupForPath(resolvedPath, code));
        });
      });

      relations.forEach(row => {
        const sourceKey = nodeKey(row.year - 1, row.source);
        const targetKey = nodeKey(row.year, row.target);
        const sourcePath = row.prevPath.length ? row.prevPath : pathByNode.get(sourceKey) || pathFromUnit(row.source);
        const targetPath = row.afterPath.length ? row.afterPath : pathByNode.get(targetKey) || pathFromUnit(row.target);
        pathByNode.set(sourceKey, sourcePath);
        pathByNode.set(targetKey, targetPath);
        groupByNode.set(sourceKey, currentGroupForPath(sourcePath, row.source));
        groupByNode.set(targetKey, currentGroupForPath(targetPath, row.target));
      });

      const lanes = new Map(years.map(year => [year, []]));
      const seen = new Map(years.map(year => [year, new Set()]));

      years.forEach(year => {
        const snapshot = snapshots.get(year) || new Map();
        snapshot.forEach((_path, code) => addLane(lanes, seen, year, code));
      });

      years.forEach(year => {
        const items = lanes.get(year);
        items.sort((a, b) => {
          const ka = sortKeyForNode(year, a, pathByNode, groupByNode);
          const kb = sortKeyForNode(year, b, pathByNode, groupByNode);
          return ka.localeCompare(kb);
        });
      });

      const yByNode = buildYPositions(lanes, pathByNode, groupByNode, years);
      return { lanes, pathByNode, groupByNode, yByNode };
    }

    function addLane(lanes, seen, year, code) {
      if (!lanes.has(year) || !code || seen.get(year).has(code)) return;
      seen.get(year).add(code);
      lanes.get(year).push(code);
    }

    function buildCarryEdges(years, nodeMap, changeRelations) {
      const changedByYear = new Map();
      changeRelations.forEach(row => {
        const key = `${row.year}::${row.source}::${row.target}`;
        changedByYear.set(key, true);
      });

      const carryEdges = [];
      for (let i = 1; i < years.length; i++) {
        const prevYear = years[i - 1];
        const year = years[i];
        const prevCodes = [...nodeMap.keys()]
          .filter(key => key.startsWith(`${prevYear}::`))
          .map(key => key.split("::")[1]);

        prevCodes.forEach(code => {
          const sourceNode = nodeMap.get(nodeKey(prevYear, code));
          const targetNode = nodeMap.get(nodeKey(year, code));
          if (!sourceNode || !targetNode) return;
          if (changedByYear.has(`${year}::${code}::${code}`)) return;
          carryEdges.push({
            id: `carry-${prevYear}-${year}-${code}`,
            year,
            type: "unchanged",
            source: code,
            target: code,
            sourceYear: prevYear,
            targetYear: year,
            sourceNode,
            targetNode
          });
        });
      }
      return carryEdges;
    }

    function buildYPositions(lanes, pathByNode, groupByNode, years) {
      const yByNode = new Map();
      const groupsByYear = new Map();
      const totalHeightByYear = new Map();

      years.forEach(year => {
        const groups = groupLaneItems(lanes.get(year) || [], year, pathByNode, groupByNode);
        groupsByYear.set(year, groups);
        const groupHeights = groups.map(group => groupHeight(group));
        const totalHeight = groupHeights.reduce((sum, height) => sum + height, 0) +
          Math.max(0, groups.length - 1) * LAYOUT.minGroupGap;
        totalHeightByYear.set(year, totalHeight);
      });

      const maxHeight = Math.max(...totalHeightByYear.values(), LAYOUT.minContentHeight);

      lanes.forEach((items, year) => {
        const groups = groupsByYear.get(year) || [];
        if (!groups.length) return;

        const groupHeights = groups.map(group => groupHeight(group));
        const usedHeight = groupHeights.reduce((sum, height) => sum + height, 0);
        const gap = groups.length > 1
          ? Math.min(
            LAYOUT.maxGroupGap,
            Math.max(LAYOUT.minGroupGap, (maxHeight - usedHeight) / (groups.length - 1))
          )
          : 0;
        let boxTop = LAYOUT.layoutTop + (groups.length === 1 ? (maxHeight - usedHeight) / 2 : 0);

        groups.forEach((group, groupIndex) => {
          group.codes.forEach((code, index) => {
            yByNode.set(nodeKey(year, code), boxTop + LAYOUT.deptBoxPadding + index * LAYOUT.nodeStep);
          });
          boxTop += groupHeights[groupIndex] + gap;
        });
      });
      return yByNode;
    }

    function groupHeight(group) {
      return Math.max(
        LAYOUT.deptBoxMinHeight,
        Math.max(0, group.codes.length - 1) * LAYOUT.nodeStep + LAYOUT.deptBoxPadding * 2
      );
    }

    function groupLaneItems(items, year, pathByNode, groupByNode) {
      const groups = [];
      let current = null;

      items.forEach(code => {
        const key = nodeKey(year, code);
        const path = pathByNode.get(key) || pathFromUnit(code);
        const college = groupByNode.get(key) || currentGroupForPath(path, code);
        const dept = deptCodeFromPath(path) || code;
        const deptGroup = `${college}::${dept}`;

        if (!current || current.deptGroup !== deptGroup) {
          current = { college, dept, deptGroup, codes: [], pathByCode: new Map() };
          groups.push(current);
        }

        current.codes.push(code);
        current.pathByCode.set(code, path);
      });

      return groups;
    }

    function groupAnchorY(group, referenceByDeptGroup, referenceByCode, componentY) {
      if (referenceByDeptGroup.has(group.deptGroup)) return referenceByDeptGroup.get(group.deptGroup);
      const candidates = group.codes
        .map(code => referenceByCode.get(code) || componentY.get(componentIdOf(code)))
        .filter(value => Number.isFinite(value));
      if (!candidates.length) return 180;
      return Math.min(...candidates);
    }

    function buildComponentY(referenceByCode) {
      const buckets = new Map();
      referenceByCode.forEach((y, code) => {
        const componentId = componentIdOf(code);
        if (!buckets.has(componentId)) buckets.set(componentId, []);
        buckets.get(componentId).push(y);
      });

      const result = new Map();
      buckets.forEach((ys, componentId) => {
        const avg = ys.reduce((sum, y) => sum + y, 0) / ys.length;
        result.set(componentId, avg);
      });
      return result;
    }

    function componentIdOf(code) {
      if (!state.componentByCode) buildComponents();
      return state.componentByCode.get(code) || code;
    }

    function buildComponents() {
      const parent = new Map();
      const find = code => {
        if (!parent.has(code)) parent.set(code, code);
        const p = parent.get(code);
        if (p === code) return code;
        const root = find(p);
        parent.set(code, root);
        return root;
      };
      const union = (a, b) => {
        if (!a || !b) return;
        const ra = find(a);
        const rb = find(b);
        if (ra !== rb) parent.set(rb, ra);
      };

      state.relations.forEach(row => union(row.source, row.target));
      state.componentByCode = new Map();
      parent.forEach((_value, code) => state.componentByCode.set(code, find(code)));
    }

    /*
    function groupRank(code) {
      const name = labelOf(code);
      const rank = [
        "유럽미주대학",
        "아시아대학",
        "사회과학대학",
        "상경대학",
        "디지털미디어·IT대학",
        "IT대학",
        "International College"
      ];
      const found = rank.findIndex(item => name.includes(item));
      return found >= 0 ? found : 100;
    }
    */

    function sortKeyForNode(year, code, pathByNode, groupByNode) {
      const path = pathByNode.get(nodeKey(year, code)) || pathFromUnit(code);
      const college = groupByNode.get(nodeKey(year, code)) || currentGroupForPath(path, code) || "";
      const dept = deptCodeFromPath(path) || code;
      const major = majorCodeFromPath(path);
      const unit = state.units.get(code);
      const level = unit?.type === "college" ? "0" : unit?.type === "department" ? "1" : "2";
      return [college, dept, level, major || code].join("|");
    }

    function drawNode(node) {
      const div = document.createElement("div");
      const type = node.unit.type || "department";
      div.className = `node ${type}`;
      div.style.left = `${node.x - LAYOUT.nodeHalfWidth}px`;
      div.style.top = `${node.y - LAYOUT.nodeHalfHeight}px`;
      div.dataset.nodeKey = nodeKey(node.year, node.code);
      div.dataset.code = node.code;
      div.dataset.search = `${node.year} ${node.code} ${node.unit.name} ${fullDisplayNameForNode(node)} ${node.unit.type} ${pathLabel(node.path)}`.toLowerCase();
      div.innerHTML = `
        <div class="node-inner">
          <span class="node-title">${escapeHtml(displayNameForNode(node))}</span>
        </div>
      `;
      div.addEventListener("mouseenter", event => showTooltip(event, node));
      div.addEventListener("mousemove", moveTooltip);
      div.addEventListener("mouseleave", hideTooltip);
      div.addEventListener("click", event => {
        event.stopPropagation();
        const key = nodeKey(node.year, node.code);
        state.selectedNodeKey = state.selectedNodeKey === key ? "" : key;
        applySearch();
      });
      canvas.appendChild(div);
    }

    function drawDeptBoxes(nodes) {
      const groups = new Map();
      nodes.forEach(node => {
        const deptCode = deptCodeFromPath(node.path);
        if (!deptCode) return;
        const hasMajor = Boolean(majorCodeFromPath(node.path));
        const collegeCode = currentGroupForPath(node.path, node.code);
        const key = `${node.year}::${collegeCode}::${deptCode}`;
        if (!groups.has(key)) {
          groups.set(key, {
            year: node.year,
            deptCode,
            x: node.x,
            minY: node.y,
            maxY: node.y,
            count: 0,
            hasMajor: false,
            nodeKeys: []
          });
        }
        const group = groups.get(key);
        group.minY = Math.min(group.minY, node.y);
        group.maxY = Math.max(group.maxY, node.y);
        group.count += 1;
        group.hasMajor = group.hasMajor || hasMajor;
        group.nodeKeys.push(nodeKey(node.year, node.code));
      });

      groups.forEach(group => {
        if (!group.hasMajor && group.count < 2) return;
        const box = document.createElement("div");
        box.className = "dept-box";
        box.style.left = `${group.x - LAYOUT.deptBoxHalfWidth}px`;
        box.style.top = `${group.minY - LAYOUT.deptBoxPadding}px`;
        box.style.height = `${Math.max(LAYOUT.deptBoxMinHeight, group.maxY - group.minY + LAYOUT.deptBoxMinHeight)}px`;
        box.dataset.nodeKeys = group.nodeKeys.join(" ");
        box.dataset.search = `${group.deptCode} ${labelOf(group.deptCode)}`.toLowerCase();
        box.innerHTML = `<div class="dept-box-title">${escapeHtml(labelOf(group.deptCode))}</div>`;
        canvas.appendChild(box);
      });
    }

    function drawGroupLabels(context, years, lanes) {
      const firstYear = years[0];
      const items = lanes.get(firstYear) || [];
      let lastGroup = "";
      items.forEach((code, laneIndex) => {
        const key = nodeKey(firstYear, code);
        const group = context.groupByNode.get(key) || topCollegeCode(code);
        if (!group || group === lastGroup) return;
        lastGroup = group;
        const label = document.createElement("div");
        label.className = "group-label";
        label.style.top = `${(context.yByNode.get(key) || LAYOUT.groupLabelFallbackY) - LAYOUT.groupLabelYOffset}px`;
        label.textContent = labelOf(group);
        canvas.appendChild(label);
      });
    }

    function drawEdges() {
      state.edges.forEach(edge => {
        const sx = edge.sourceNode.x + LAYOUT.edgeAnchorOffset;
        const sy = edge.sourceNode.y;
        const tx = edge.targetNode.x - LAYOUT.edgeAnchorOffset;
        const ty = edge.targetNode.y;
        const mid = (sx + tx) / 2;
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("class", `flow-line ${edge.type}`);
        path.dataset.edgeId = edge.id;
        path.dataset.sourceKey = nodeKey(edge.sourceYear, edge.source);
        path.dataset.targetKey = nodeKey(edge.targetYear, edge.target);
        path.dataset.search = `${edge.year} ${edge.type} ${edge.source} ${edge.target} ${labelOf(edge.source)} ${labelOf(edge.target)}`.toLowerCase();
        const cp2x = tx - Math.min(LAYOUT.edgeControlMaxOffset, (tx - sx) * 0.28);
        const cp2y = ty - (ty - sy) * 0.28;
        path.setAttribute("d", `M ${sx} ${sy} C ${mid} ${sy}, ${cp2x} ${cp2y}, ${tx} ${ty}`);
        svg.appendChild(path);

        const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
        label.setAttribute("class", `edge-label ${edge.type}`);
        label.setAttribute("x", mid);
        label.setAttribute("y", (sy + ty) / 2 - LAYOUT.edgeLabelYOffset);
        label.setAttribute("text-anchor", "middle");
        label.dataset.edgeId = edge.id;
        label.dataset.search = path.dataset.search;
        label.textContent = CHANGE_TYPE_LABELS[edge.type] ?? edge.type;
        svg.appendChild(label);
      });
    }

    function clearSvg() {
      svg.querySelectorAll(".flow-line,.edge-label").forEach(el => el.remove());
    }

    function applySearch() {
      const term = searchBox.value.trim().toLowerCase();
      const nodes = canvas.querySelectorAll(".node");
      const boxes = canvas.querySelectorAll(".dept-box");
      const edges = svg.querySelectorAll(".flow-line,.edge-label");
      const selected = state.selectedNodeKey;
      const connected = selected ? connectedNodeKeys(selected) : new Set();

      nodes.forEach(node => {
        node.classList.remove("focus", "related", "dimmed");
      });
      boxes.forEach(box => {
        box.classList.remove("focus", "related", "dimmed");
      });
      edges.forEach(edge => {
        edge.classList.remove("focus", "dimmed");
      });

      if (selected) {
        nodes.forEach(node => {
          const hit = connected.has(node.dataset.nodeKey);
          node.classList.toggle("focus", hit);
          node.classList.toggle("dimmed", !hit);
        });

        boxes.forEach(box => {
          const keys = box.dataset.nodeKeys.split(" ").filter(Boolean);
          const hit = keys.some(key => connected.has(key));
          box.classList.toggle("focus", hit);
          box.classList.toggle("dimmed", !hit);
        });

        edges.forEach(edge => {
          const hit = connected.has(edge.dataset.sourceKey) && connected.has(edge.dataset.targetKey);
          edge.classList.toggle("focus", hit);
          edge.classList.toggle("dimmed", !hit);
        });
      }

      if (!term) {
        updateDetailPanel();
        return;
      }

      const matchedKeys = new Set();
      nodes.forEach(node => {
        const hit = node.dataset.search.includes(term);
        if (hit) matchedKeys.add(node.dataset.nodeKey);
      });

      const relatedKeys = new Set(matchedKeys);
      const activeEdgeIds = new Set();
      edges.forEach(edge => {
        const sourceKey = edge.dataset.sourceKey;
        const targetKey = edge.dataset.targetKey;
        const edgeHit = edge.dataset.search.includes(term);
        const touchesMatchedNode = matchedKeys.has(sourceKey) || matchedKeys.has(targetKey);
        if (!edgeHit && !touchesMatchedNode) return;
        if (edge.dataset.edgeId) activeEdgeIds.add(edge.dataset.edgeId);
        if (sourceKey) relatedKeys.add(sourceKey);
        if (targetKey) relatedKeys.add(targetKey);
      });

      nodes.forEach(node => {
        const directHit = matchedKeys.has(node.dataset.nodeKey);
        const relatedHit = relatedKeys.has(node.dataset.nodeKey);
        node.classList.toggle("focus", directHit);
        node.classList.toggle("related", !directHit && relatedHit);
        node.classList.toggle("dimmed", !relatedHit);
      });

      boxes.forEach(box => {
        const keys = box.dataset.nodeKeys.split(" ").filter(Boolean);
        const directHit = box.dataset.search.includes(term) || keys.some(key => matchedKeys.has(key));
        const relatedHit = directHit || keys.some(key => relatedKeys.has(key));
        box.classList.toggle("focus", directHit || box.classList.contains("focus"));
        box.classList.toggle("related", !directHit && relatedHit);
        box.classList.toggle("dimmed", !relatedHit);
      });

      edges.forEach(edge => {
        const hit = activeEdgeIds.has(edge.dataset.edgeId);
        edge.classList.toggle("focus", hit || edge.classList.contains("focus"));
        edge.classList.toggle("dimmed", !hit);
      });
      updateDetailPanel();
    }

    function connectedNodeKeys(startKey) {
      const connected = new Set([startKey]);
      const queue = [startKey];

      while (queue.length) {
        const key = queue.shift();
        state.edges.forEach(edge => {
          const sourceKey = nodeKey(edge.sourceYear, edge.source);
          const targetKey = nodeKey(edge.targetYear, edge.target);
          if (sourceKey !== key && targetKey !== key) return;
          const other = sourceKey === key ? targetKey : sourceKey;
          if (!connected.has(other)) {
            connected.add(other);
            queue.push(other);
          }
        });
      }

      return connected;
    }

    function showTooltip(event, node) {
      const type = UNIT_TYPE_LABELS[node.unit.type] || node.unit.type || "학과(전공)";
      const title = fullDisplayNameForNode(node);
      const relatedEdge = state.edges.find(edge =>
        edge.source === node.code &&
        edge.sourceYear === node.year &&
        edge.validUntil &&
        ["closed", "splitted", "merged", "renewed"].includes(edge.type)
      );
      const retainMessage = relatedEdge
        ? `<br><span style="color:var(--muted)">${escapeHtml(`${title}${josa(title, "은/는")} ${retentionLabel(relatedEdge.validUntil)}`)}</span>`
        : "";
      tooltip.innerHTML = `
        <strong>${escapeHtml(title)}</strong><br>
        ${escapeHtml(node.year)}학년도 · ${escapeHtml(type)}<br>
        <span style="color:var(--muted)">${escapeHtml(node.code)}</span>${retainMessage}
      `;
      tooltip.style.display = "block";
      moveTooltip(event);
    }

    function updateDetailPanel() {
      if (!state.selectedNodeKey) {
        hideDetailPanel();
        return;
      }

      const node = state.nodes.find(item => nodeKey(item.year, item.code) === state.selectedNodeKey);
      if (!node) {
        state.selectedNodeKey = "";
        hideDetailPanel();
        return;
      }

      const incoming = state.edges.filter(edge => nodeKey(edge.targetYear, edge.target) === state.selectedNodeKey);
      const outgoing = state.edges.filter(edge => nodeKey(edge.sourceYear, edge.source) === state.selectedNodeKey);
      const type = UNIT_TYPE_LABELS[node.unit.type] || node.unit.type || "학과(전공)";
      const title = fullDisplayNameForNode(node);
      const collegeCode = collegeCodeFromPath(node.path, node.code);
      const deptCode = deptCodeFromPath(node.path);
      const detailRows = [
        detailRow("코드", node.code),
        collegeCode ? detailRow("소속단대", labelOf(collegeCode)) : "",
        deptCode && deptCode !== node.code ? detailRow("소속학부", labelOf(deptCode)) : ""
      ].join("");

      detailPanel.innerHTML = `
        <div class="detail-head">
          <div>
            <h2 class="detail-title">${escapeHtml(title)}</h2>
            <div class="detail-subtitle">${escapeHtml(node.year)}학년도 · ${escapeHtml(type)}</div>
          </div>
          <button class="detail-close" type="button" aria-label="상세 닫기">닫기</button>
        </div>
        <div class="detail-body">
          <section class="detail-section">
            <div class="detail-section-title">기본 정보</div>
            <dl class="detail-list">
              ${detailRows}
            </dl>
          </section>
          ${relationSection([...incoming, ...outgoing], edge => incoming.includes(edge) ? "incoming" : "outgoing")}
        </div>
      `;
      detailPanel.querySelector(".detail-close").addEventListener("click", () => {
        state.selectedNodeKey = "";
        hideDetailPanel();
        applySearch();
      });
      attachDetailPanelDrag();
      detailPanel.classList.add("is-open");
      revealDetailPanel();
    }

    function hideDetailPanel() {
      detailPanel.classList.remove("is-open");
      detailPanel.classList.remove("is-dragging");
      detailPanel.innerHTML = "";
      state.detailPanelMoved = false;
      state.detailDrag = null;
    }

    function revealDetailPanel() {
      state.detailPanelMoved = false;
      positionDetailPanel();
    }

    function positionDetailPanel() {
      const anchor = selectedNodeElement();
      if (!anchor) return;

      const panelWidth = detailPanel.offsetWidth || LAYOUT.detailPanelWidth;
      const panelHeight = detailPanel.offsetHeight || 260;
      const gap = 10;
      const minLeft = 12;
      const maxLeft = Math.max(minLeft, canvas.clientWidth - panelWidth - 12);
      const centeredLeft = anchor.offsetLeft + anchor.offsetWidth / 2 - panelWidth / 2;
      const belowTop = anchor.offsetTop + anchor.offsetHeight + gap;
      const aboveTop = anchor.offsetTop - panelHeight - gap;
      const top = belowTop + panelHeight + 12 <= canvas.clientHeight
        ? belowTop
        : Math.max(12, aboveTop);

      detailPanel.style.left = `${clamp(centeredLeft, minLeft, maxLeft)}px`;
      detailPanel.style.top = `${top}px`;
    }

    function attachDetailPanelDrag() {
      const handle = detailPanel.querySelector(".detail-head");
      if (!handle) return;

      handle.addEventListener("pointerdown", event => {
        if (event.target.closest(".detail-close")) return;
        event.preventDefault();

        const left = parseFloat(detailPanel.style.left) || 0;
        const top = parseFloat(detailPanel.style.top) || 0;
        state.detailDrag = {
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          left,
          top
        };
        state.detailPanelMoved = true;
        detailPanel.classList.add("is-dragging");
        handle.setPointerCapture(event.pointerId);
      });

      handle.addEventListener("pointermove", event => {
        const drag = state.detailDrag;
        if (!drag || drag.pointerId !== event.pointerId) return;

        const maxLeft = Math.max(12, canvas.clientWidth - detailPanel.offsetWidth - 12);
        const maxTop = Math.max(12, canvas.clientHeight - detailPanel.offsetHeight - 12);
        const nextLeft = drag.left + event.clientX - drag.startX;
        const nextTop = drag.top + event.clientY - drag.startY;

        detailPanel.style.left = `${clamp(nextLeft, 12, maxLeft)}px`;
        detailPanel.style.top = `${clamp(nextTop, 12, maxTop)}px`;
      });

      handle.addEventListener("pointerup", event => finishDetailPanelDrag(event.pointerId, handle));
      handle.addEventListener("pointercancel", event => finishDetailPanelDrag(event.pointerId, handle));
    }

    function finishDetailPanelDrag(pointerId, handle) {
      const drag = state.detailDrag;
      if (!drag || drag.pointerId !== pointerId) return;
      state.detailDrag = null;
      detailPanel.classList.remove("is-dragging");
      if (handle.hasPointerCapture(pointerId)) {
        handle.releasePointerCapture(pointerId);
      }
    }

    function selectedNodeElement() {
      return [...canvas.querySelectorAll(".node")]
        .find(node => node.dataset.nodeKey === state.selectedNodeKey);
    }

    function detailRow(label, value) {
      return `
        <div class="detail-row">
          <dt>${escapeHtml(label)}</dt>
          <dd>${escapeHtml(value)}</dd>
        </div>
      `;
    }

    function relationSection(edges, directionForEdge) {
      const relationItems = edges
        .map(edge => ({ edge, direction: directionForEdge(edge) }))
        .sort((a, b) => relationSortValue(a) - relationSortValue(b));
      const items = relationItems
        .map((item, index) => {
          const previous = relationItems[index - 1];
          const startsNewDirection = Boolean(previous && previous.direction !== item.direction);
          return relationItem(item.edge, item.direction, startsNewDirection);
        })
        .join("");
      return `
        <section class="detail-section relation-section">
          <div class="detail-section-title">변경 관계</div>
          <ul class="relation-list">
            ${items || '<li class="relation-card relation-note">연결 정보 없음</li>'}
          </ul>
        </section>
      `;
    }

    function relationItem(edge, direction, startsNewDirection = false) {
      const otherCode = direction === "incoming" ? edge.source : edge.target;
      const otherYear = direction === "incoming" ? edge.sourceYear : edge.targetYear;
      const otherName = displayNameForKey(otherYear, otherCode);
      const badge = direction === "incoming" ? "전년도" : "다음연도";
      const particle = direction === "incoming" ? "에서" : josa(otherName, "으로/로");
      const relationCopy = edge.type === "unchanged"
        ? changeTypeLabel(edge.type)
        : `${otherName}${particle} ${changeTypeLabel(edge.type)}`;
      const retention = retentionCopy(edge, direction, otherName);
      const note = edge.note ? `<div class="relation-note">${escapeHtml(edge.note)}</div>` : "";
      const directionClass = startsNewDirection ? " is-new-direction" : "";
      return `
        <li class="relation-card${directionClass}">
          <div class="relation-main">
            <span class="relation-badge">${escapeHtml(badge)}</span>
            <span class="relation-copy">${escapeHtml(relationCopy)}</span>
          </div>
          ${retention ? `<div class="relation-note">${escapeHtml(retention)}</div>` : ""}
          ${note}
        </li>
      `;
    }

    function relationSortValue(edge) {
      const directionValue = state.selectedNodeKey === nodeKey(edge.targetYear, edge.target) ? 0 : 10;
      const changeValue = edge.type === "unchanged" ? 1 : 0;
      return directionValue + changeValue;
    }

    function changeTypeLabel(type) {
      if (type === "unchanged") return "변경없음";
      return CHANGE_TYPE_LABELS[type] ?? type;
    }

    function retentionCopy(edge, direction, otherName) {
      if (!edge.validUntil) return "";
      const target = direction === "incoming" ? otherName : "현재 학과(전공)";
      return `${target}${josa(target, "은/는")} ${retentionLabel(edge.validUntil)}`;
    }

    function retentionLabel(validUntil) {
      return validUntil === "9999"
        ? "현 재적생이 졸업할 때까지 유지"
        : `${validUntil}학년도 졸업자까지 유지`;
    }

    function finalConsonantIndex(text) {
      const chars = [...String(text).trim()].reverse();
      for (const char of chars) {
        const code = char.charCodeAt(0);
        if (code >= 0xac00 && code <= 0xd7a3) {
          return (code - 0xac00) % 28;
        }
      }
      return -1;
    }

    function josa(text, pair) {
      const jong = finalConsonantIndex(text);
      const [withBatchim, withoutBatchim] = pair.split("/");

      if (pair === "으로/로") {
        return jong !== 0 && jong !== 8 ? "으로" : "로";
      }

      return jong !== 0 ? withBatchim : withoutBatchim;
    }

    function moveTooltip(event) {
      tooltip.style.left = `${event.clientX + 14}px`;
      tooltip.style.top = `${event.clientY + 14}px`;
    }

    function hideTooltip() {
      tooltip.style.display = "none";
    }

    function nodeKey(year, code) {
      return `${year}::${code}`;
    }

    function labelOf(code) {
      return state.units.get(code)?.name || code || "";
    }

    function pathFromUnit(code) {
      const path = [];
      const seen = new Set();
      let current = code;
      while (current && !seen.has(current)) {
        seen.add(current);
        path.unshift(current);
        current = state.units.get(current)?.parent || "";
      }
      return path;
    }

    function deptCodeFromPath(path) {
      return (path || []).find(code => state.units.get(code)?.type === "department") || "";
    }

    function majorCodeFromPath(path) {
      return (path || []).find(code => state.units.get(code)?.type === "major") || "";
    }

    function collegeCodeFromPath(path, fallbackCode = "") {
      return (path || []).find(code => state.units.get(code)?.type === "college") || topCollegeCode(fallbackCode) || "";
    }

    function topCollegeCode(code) {
      const path = pathFromUnit(code);
      return path.find(item => state.units.get(item)?.type === "college") || path[0] || "";
    }

    function currentGroupForPath(path, code) {
      return (path || []).find(item => state.units.get(item)?.type === "college") || topCollegeCode(code) || (path || [])[0] || "";
    }

    function pathLabel(path) {
      return (path || [])
        .map(code => labelOf(code))
        .filter(Boolean)
        .join(" > ");
    }

    function parentPathLabel(path) {
      const items = (path || []).slice(0, 2).map(code => labelOf(code)).filter(Boolean);
      return items.join(" > ");
    }

    function displayNameForNode(node) {
      return shortLabel(node.unit.name || node.code);
    }

    function fullDisplayNameForNode(node) {
      const name = node.unit.name || node.code;
      if (node.unit.type !== "major") return name;

      const deptCode = deptCodeFromPath(node.path);
      const deptName = deptCode ? labelOf(deptCode) : "";
      return deptName.endsWith("학부") ? `${deptName}(${name})` : name;
    }

    function displayNameForKey(year, code) {
      const node = state.nodes.find(item => item.year === year && item.code === code);
      if (node) return fullDisplayNameForNode(node);
      return labelOf(code) || code || "-";
    }

    function shortLabel(value) {
      const text = String(value || "");
      return text.length > 18 ? `${text.slice(0, 17)}…` : text;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[ch]));
    }
  </script>
</body>
</html>
